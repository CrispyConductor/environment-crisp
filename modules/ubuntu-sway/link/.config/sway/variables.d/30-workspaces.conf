# Workspaces 11-20.
#
# /etc/sway/variables defines $ws1 through $ws10 only. These extend the same
# pattern for the second bank bound in config.d/25-workspaces-11-20.conf.
#
# The "number" keyword is the whole point of these variables and is not
# optional. "workspace 11" addresses a workspace *named* "11", and Ubuntu Sway
# Remix autostarts autoname-workspaces.py, which rewrites every workspace's name
# on each window event to carry per-app icons - so the moment a window opens
# there, workspace 11 is named "11:   " and no longer matches. Sway would then
# create a second workspace for the literal name "11", giving two workspaces
# that both display as 11. "workspace number 11" matches on the number, which
# autoname never touches.
set $ws11 number 11
set $ws12 number 12
set $ws13 number 13
set $ws14 number 14
set $ws15 number 15
set $ws16 number 16
set $ws17 number 17
set $ws18 number 18
set $ws19 number 19
set $ws20 number 20
