# Fills in variables that Ubuntu Sway Remix's own keybindings reference but that
# /etc/sway/variables no longer defines. Both are upstream packaging bugs in
# ubuntu-sway-default-settings: the bindings in /etc/sway/modes/default.conf were
# left behind when the underlying tools were swapped out.
#
# An undefined sway variable is not an error. Sway leaves the "$name" text
# literal, exec hands the line to sh, and sh expands the unset variable to
# nothing - so the binding runs an empty command and silently does nothing.
# That is why these never showed up as config errors.
#
# variables.d is included before /etc/sway/modes/*.conf (see ~/.config/sway/config),
# so defining them here is enough; the stock bindings pick them up as-is.

# Used by $mod+Shift+p in /etc/sway/modes/default.conf. Opens the clipboard
# history picker: nwg-clipman lists what cliphist has stored and puts the entry
# you choose back on the Wayland clipboard, ready for the next paste.
#
# Dropped from /etc/sway/variables in ubuntu-sway-default-settings 24.10.2
# ("Switch to nwg-clipman as clipboard manager frontend").
#
# No waybar refresh here on purpose. The waybar module's own on-click appends
# "pkill -RTMIN+9 waybar" to update its item counter, but that fires the instant
# nwg-clipman is spawned - long before anything is selected - so it does nothing
# useful. The $cliphist_watch autostart already signals waybar on every real
# clipboard change, which is what actually keeps the counter correct.
set $clipboard nwg-clipman

# Used by XF86ScreenSaver in /etc/sway/modes/default.conf - the dedicated
# lock/screensaver key some keyboards have. No machine here has that key today,
# but this config is shared across machines, so wire it to the same helper
# Ctrl+Escape and swayidle use rather than leaving it dead.
set $lock $HOME/.userenv/libexec/sway/lock.sh
