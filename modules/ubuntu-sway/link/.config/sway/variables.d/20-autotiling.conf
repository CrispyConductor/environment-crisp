# Autotiling off by default.
#
# The stock value in /etc/sway/variables starts it on the odd workspaces:
#
#     set $autotiling '[ -x "$(command -v autotiling)" ] && autotiling -w 1 3 5 7 9'
#
# and /etc/sway/config.d/40-autostart-applications.conf runs it as "exec
# $autotiling". Overriding the variable with a no-op is the clean way to
# suppress that: variables.d is included before config.d, so the autostart
# block execs "true" and no autotiling process is ever started. Editing the
# distro's autostart file would work too, but this keeps the change in the one
# place the distro documents as ours.
#
# Why off: autotiling reruns its rule on every window event, focus changes
# included, and rewrites the focused container's split direction whenever the
# window's aspect ratio disagrees with it. That means a manual $mod+b/$mod+v is
# reverted the next time the window is focused - you cannot hold a deliberate
# layout on an autotiled workspace. It also wraps each newly focused window in
# a fresh single-child container, and sway never collapses those, so nesting
# depth grows just from navigating. On four large displays the resulting
# dwindle spiral halves the smallest region for each new window, which is not
# the arrangement wanted often enough to pay for the above.
#
# Not gone, just not on: Super+Shift+a (libexec/sway/autotiling-toggle.sh)
# enables it for the focused workspace on demand and starts the process then,
# and Super+Shift+t retiles an existing workspace with it.
set $autotiling true
