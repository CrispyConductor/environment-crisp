# All workspace bindings: the stock 1-10 rebound to fix an upstream bug, a
# second bank of ten on $mod+Ctrl, and ways to reach a workspace without
# knowing its number.
#
#   $mod+1..9,0             switch to workspace 1-10       (stock keys, rebound)
#   $mod+Shift+1..9,0       move the focused window there  (stock keys, rebound)
#   $mod+Ctrl+1..9,0        switch to workspace 11-20
#   $mod+Ctrl+Shift+1..9,0  move the focused window there
#   $mod+g / $mod+Shift+g   pick a workspace from a list / send the window there
#   $mod+Ctrl+Left/Right    previous / next workspace on this output
#
# The second bank keeps the digit row and the "Shift means move it there"
# convention of the stock bindings, one modifier up. 0 maps to 20, mirroring
# 0 -> 10.
#
# $ws1..$ws10 come from /etc/sway/variables, $ws11..$ws20 from
# variables.d/30-workspaces.conf. All of them expand to "number N" rather than a
# bare name, which is load-bearing rather than stylistic: Ubuntu Sway Remix
# autostarts autoname-workspaces.py, which rewrites every workspace's name on
# each window event to carry per-app icons. A binding written as "workspace 11"
# addresses the *name* "11", stops matching the moment a window opens there and
# renames it to "11:   ", and sway then creates a second workspace for the
# literal name - two workspaces both showing as 11. "number N" matches the
# number, which autoname never touches.

### Why the stock 1-10 bindings are rebound here
#
# /etc/sway/modes/default.conf moves a window to a workspace with:
#
#     set $focus_ws [ "$focus_after_move" == 'true' ] && swaymsg workspace
#     $bindsym $mod+Shift+1 move container to workspace $ws1, exec $focus_ws $ws1
#
# $focus_after_move is documented in variables.d/README.md as the switch for
# following a window to the workspace you just sent it to. It does not work, and
# never has on this distro: sway runs exec through sh, sh here is dash, and
# dash's [ has no == operator. Every press exits 2 with
#
#     sh: 1: [: unexpected operator
#
# into the sway log. The bug is invisible in normal use because a failed test
# and a false test both mean "do not follow", so the default behaviour looks
# correct - but setting $focus_after_move true silently does nothing.
#
# Redefining $focus_ws alone would not fix it. Sway substitutes variables as it
# parses each line, so the ten stock bindings were already expanded with the
# broken text by the time config.d is read; only rebinding the keys re-expands
# them. Hence the ten overrides below, which are otherwise identical to the
# stock lines.
#
# --no-warn on those ten because they deliberately replace bindings made
# earlier in modes/; without it sway logs "Overriding binding" for each on every
# config load.
set $focus_ws_ok [ "$focus_after_move" = 'true' ] && swaymsg workspace

## Navigation // Switch workspace // $mod + [number] ##
# Not rebound: the stock switch bindings carry no exec and are unaffected.

## Action // Move focused window to workspace 1-10 // $mod + Shift + [number] ##
bindsym --to-code --no-warn $mod+Shift+1 move container to workspace $ws1, exec $focus_ws_ok $ws1
bindsym --to-code --no-warn $mod+Shift+2 move container to workspace $ws2, exec $focus_ws_ok $ws2
bindsym --to-code --no-warn $mod+Shift+3 move container to workspace $ws3, exec $focus_ws_ok $ws3
bindsym --to-code --no-warn $mod+Shift+4 move container to workspace $ws4, exec $focus_ws_ok $ws4
bindsym --to-code --no-warn $mod+Shift+5 move container to workspace $ws5, exec $focus_ws_ok $ws5
bindsym --to-code --no-warn $mod+Shift+6 move container to workspace $ws6, exec $focus_ws_ok $ws6
bindsym --to-code --no-warn $mod+Shift+7 move container to workspace $ws7, exec $focus_ws_ok $ws7
bindsym --to-code --no-warn $mod+Shift+8 move container to workspace $ws8, exec $focus_ws_ok $ws8
bindsym --to-code --no-warn $mod+Shift+9 move container to workspace $ws9, exec $focus_ws_ok $ws9
bindsym --to-code --no-warn $mod+Shift+0 move container to workspace $ws10, exec $focus_ws_ok $ws10

## Navigation // Switch workspace 11-20 // $mod + Ctrl + [number] ##
$bindsym $mod+Ctrl+1 workspace $ws11
$bindsym $mod+Ctrl+2 workspace $ws12
$bindsym $mod+Ctrl+3 workspace $ws13
$bindsym $mod+Ctrl+4 workspace $ws14
$bindsym $mod+Ctrl+5 workspace $ws15
$bindsym $mod+Ctrl+6 workspace $ws16
$bindsym $mod+Ctrl+7 workspace $ws17
$bindsym $mod+Ctrl+8 workspace $ws18
$bindsym $mod+Ctrl+9 workspace $ws19
$bindsym $mod+Ctrl+0 workspace $ws20

## Action // Move focused window to workspace 11-20 // $mod + Ctrl + Shift + [number] ##
$bindsym $mod+Ctrl+Shift+1 move container to workspace $ws11, exec $focus_ws_ok $ws11
$bindsym $mod+Ctrl+Shift+2 move container to workspace $ws12, exec $focus_ws_ok $ws12
$bindsym $mod+Ctrl+Shift+3 move container to workspace $ws13, exec $focus_ws_ok $ws13
$bindsym $mod+Ctrl+Shift+4 move container to workspace $ws14, exec $focus_ws_ok $ws14
$bindsym $mod+Ctrl+Shift+5 move container to workspace $ws15, exec $focus_ws_ok $ws15
$bindsym $mod+Ctrl+Shift+6 move container to workspace $ws16, exec $focus_ws_ok $ws16
$bindsym $mod+Ctrl+Shift+7 move container to workspace $ws17, exec $focus_ws_ok $ws17
$bindsym $mod+Ctrl+Shift+8 move container to workspace $ws18, exec $focus_ws_ok $ws18
$bindsym $mod+Ctrl+Shift+9 move container to workspace $ws19, exec $focus_ws_ok $ws19
$bindsym $mod+Ctrl+Shift+0 move container to workspace $ws20, exec $focus_ws_ok $ws20

## Navigation // Pick a workspace from a list ##
# Twenty workspaces is past what anyone tracks by number. swayr lists the ones
# that actually exist, with the autoname icons showing what is on each, so this
# is the practical way in for everything outside the handful you think of
# positionally. swayrd is already running for $mod+p and Alt+Tab.
#
# First use generates ~/.config/swayr/config.toml and pops a swaynag banner
# saying so; that is expected, and only happens once.
$bindsym $mod+g exec swayr switch-workspace
$bindsym $mod+Shift+g exec swayr move-focused-to-workspace

## Navigation // Previous/next workspace on this output ##
# _on_output rather than plain prev/next: with four displays, plain next walks
# into workspaces sitting on other monitors, which reads as the focus vanishing.
$bindsym $mod+Ctrl+Left workspace prev_on_output
$bindsym $mod+Ctrl+Right workspace next_on_output
