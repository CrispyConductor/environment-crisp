# Super+Shift+Return is already the plain-terminal binding (see
# /etc/sway/modes/default.conf), so this uses Ctrl instead of Shift.
$bindsym $mod+Ctrl+Return exec firefox

# Emoji picker. The stock binding in /etc/sway/modes/default.conf still calls
# fuzzel-emoji, left over from when Fuzzel was the launcher; the distro moved to
# Wofi in ubuntu-sway-default-settings 25.04 and dropped fuzzel from
# ubuntu-sway-desktop's Recommends, so that binding runs a command that is not
# installed. wofi-emoji is the replacement and ships in the same package that
# carries the stale binding.
#
# --no-warn because this deliberately overrides the binding from modes/, which
# is included earlier; without it sway logs "Overriding binding" on every load.
bindsym --to-code --no-warn Alt+Shift+e exec wofi-emoji

# Lock the screen. Goes through the same helper swayidle uses so a manual lock
# looks identical to an idle lock. It wraps gtklock (the Ubuntu Sway Remix
# default) with flags that work on this compositor; see the script for why the
# distro's own lock.sh leaves the password form unusable here.
$bindsym Ctrl+Escape exec $HOME/.userenv/libexec/sway/lock.sh
