# Super+Shift+Return is already the plain-terminal binding (see
# /etc/sway/modes/default.conf), so this uses Ctrl instead of Shift.
$bindsym $mod+Ctrl+Return exec firefox

# KeePassXC: focus the existing window, and only launch if there is not one.
#
# A plain "exec keepassxc" is not enough. KeePassXC is single-instance, so a
# second launch signals the running process and exits - verified: still one
# process, still one window - but the running instance does not take focus, so
# the key appears to do nothing whenever KeePassXC is already open, which is
# almost always. swaymsg exits 2 with "No matching node." when the criteria
# matches nothing, so || is enough to cover the not-running case.
$bindsym $mod+Ctrl+k exec swaymsg -q '[app_id="org.keepassxc.KeePassXC"] focus' || keepassxc

# Emoji picker. The stock binding in /etc/sway/modes/default.conf still calls
# fuzzel-emoji, left over from when Fuzzel was the launcher; the distro moved to
# Wofi in ubuntu-sway-default-settings 25.04 and dropped fuzzel from
# ubuntu-sway-desktop's Recommends, so that binding runs a command that is not
# installed. wofi-emoji is the replacement and ships in the same package that
# carries the stale binding.
#
# --no-warn because this deliberately overrides the binding from modes/, which
# is included earlier; without it sway logs "Overriding binding" on every load.
bindsym --to-code --no-warn Alt+Shift+e exec wofi-emoji

# Focus back down out of a container.
#
# $mod+a (focus parent) selects the container holding the focused window, which
# is how you act on a whole group. Sway has no default binding for the way back,
# and none of the obvious things work: the directional keys do nothing, because
# the container has no sibling in any direction to move to, and leaving the
# workspace and returning keeps the container focused. Without this you have to
# click a window to get out.
#
# Not a strict inverse of $mod+a: focus child descends to the *last-focused*
# child, so after walking up several levels it need not retrace the same path.
# For the usual case - one press to escape container focus - it does.
$bindsym $mod+c focus child

# Layout management. Sway has no command to undo accumulated nesting, and
# autotiling has no runtime switch, so both are scripts; see the files for why.
#
#   Super+Shift+a  toggle autotiling for the focused workspace
#   Super+Shift+f  flatten: every window becomes a direct child of the workspace
#   Super+Shift+t  retile: flatten, then let autotiling rebuild its spiral
#   Super+Shift+\  dissolve the container around the focused window, if it is
#                  the only one in it - the single-child containers that pile up
#                  from $mod+b/$mod+v and from autotiling, and that nothing else
#                  cleans up (sway keeps them even after a sibling closes)
#   Super+Shift+u  even out the row/column the focused window is in (u: uniform).
#                  Sway has no balance/equalize command at all, so this is a
#                  sweep of `resize set ... ppt`; see the script for why that
#                  needs several passes and still lands ~1% off.
$bindsym $mod+Shift+a exec $HOME/.userenv/libexec/sway/autotiling-toggle.sh
$bindsym $mod+Shift+f exec $HOME/.userenv/libexec/sway/retile-workspace.sh flatten
$bindsym $mod+Shift+t exec $HOME/.userenv/libexec/sway/retile-workspace.sh retile
$bindsym $mod+Shift+u exec $HOME/.userenv/libexec/sway/balance-container.sh
$bindsym $mod+Shift+backslash split none

# Show the container tree for the focused workspace in a floating terminal.
# Sway's layout behaviour is entirely a function of the tree, but a container
# holding one window is invisible on screen, so this is the fastest way to see
# why a move went somewhere unexpected. Marks those lone containers explicitly.
#
# Its own app_id rather than the stock floating_shell, so the window rule below
# can size it without affecting the other floating TUIs. footclient because a
# foot --server is already running, which makes it open instantly.
$bindsym $mod+Shift+i exec footclient -a sway-tree $HOME/.userenv/libexec/sway/show-tree.sh
for_window [app_id="sway-tree"] floating enable, sticky enable, border pixel 2, \
	resize set width 45 ppt height 55 ppt, move position center

# Lock the screen. Goes through the same helper swayidle uses so a manual lock
# looks identical to an idle lock. It wraps gtklock (the Ubuntu Sway Remix
# default) with flags that work on this compositor; see the script for why the
# distro's own lock.sh leaves the password form unusable here.
$bindsym Ctrl+Escape exec $HOME/.userenv/libexec/sway/lock.sh
