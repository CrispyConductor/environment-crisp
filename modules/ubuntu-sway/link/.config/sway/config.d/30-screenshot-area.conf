# Adds a fourth screenshot-mode option, "Region" (r), that does a real
# click-drag area selection.
#
# The stock "Pick" (p) binding - see /etc/sway/modes/screenshot.conf and
# /etc/sway/variables - uses grimshot's `window` target, which is click-only
# (no drag): it screenshots whatever window you click on. grimshot's `area`
# target is the one that does free-form drag-select via slurp. Rather than
# repurposing "Pick", this adds "Region" alongside it.
#
# sway's fancy mode popup renders the mode's *name*, so extending the hint
# text means redefining $mode_screenshot to a new string and re-binding
# Print to it - the mode block from /etc/sway/modes/screenshot.conf, bound to
# the old string, is simply left orphaned (harmless).

set $mode_screenshot "<span foreground='$color10'></span>  \
<span foreground='$color5'><b>Pick</b></span> <span foreground='$color10'>(<b>p</b>)</span> \
<span foreground='$color5'><b>Region</b></span> <span foreground='$color10'>(<b>r</b>)</span> \
<span foreground='$color5'><b>Output</b></span> <span foreground='$color10'>(<b>o</b>)</span> \
<span foreground='$color5'><b>Active</b></span> <span foreground='$color10'>(<b>a</b>)</span>"

bindsym --to-code --no-warn Print mode $mode_screenshot

mode --pango_markup $mode_screenshot {
	bindsym o mode "default", exec $screenshot_screen
	bindsym p mode "default", exec $screenshot_selection
	bindsym a mode "default", exec $screenshot_active
	bindsym r mode "default", exec $grimshot save area - | $swappy && $notify_paste
	bindsym Escape mode "default"
}
