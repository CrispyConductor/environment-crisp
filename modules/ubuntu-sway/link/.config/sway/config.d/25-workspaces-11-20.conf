# A second bank of workspaces on $mod+Ctrl, plus ways to reach workspaces
# without knowing their number.
#
#   $mod+Ctrl+1..9,0        switch to workspace 11-20
#   $mod+Ctrl+Shift+1..9,0  move the focused window to workspace 11-20
#   $mod+g / $mod+Shift+g   pick a workspace from a list / send the window there
#   $mod+Ctrl+Left/Right    previous / next workspace on this output
#
# Same digit row and the same "Shift means move it there" convention as the
# stock 1-10 bindings, one modifier up. 0 maps to 20, mirroring 0 -> 10.
#
# The $ws11..$ws20 variables come from variables.d/30-workspaces.conf and expand
# to "number N", not a bare name; see that file for why that matters here.

# Moving to a workspace optionally follows the window there, matching the stock
# $mod+Shift+1..10 bindings. Those use $focus_ws from /etc/sway/modes/default.conf:
#
#     set $focus_ws [ "$focus_after_move" == 'true' ] && swaymsg workspace
#
# which is broken: sway execs with sh, sh here is dash, and dash's [ has no ==
# operator, so that line exits 2 with "[: unexpected operator" on every use. The
# visible behaviour is right only because the failure and the not-following case
# look identical. Rather than copy the bug, this defines the same thing with the
# POSIX = operator. Redefining $focus_ws itself would not help the stock
# bindings - sway substitutes variables when it parses each line, so 1-10 were
# already expanded with the old value by the time config.d is read.
set $focus_ws_ok [ "$focus_after_move" = 'true' ] && swaymsg workspace

## Navigation // Switch workspace 11-20 // $mod + Ctrl + [number] ##
$bindsym $mod+Ctrl+1 workspace $ws11
$bindsym $mod+Ctrl+2 workspace $ws12
$bindsym $mod+Ctrl+3 workspace $ws13
$bindsym $mod+Ctrl+4 workspace $ws14
$bindsym $mod+Ctrl+5 workspace $ws15
$bindsym $mod+Ctrl+6 workspace $ws16
$bindsym $mod+Ctrl+7 workspace $ws17
$bindsym $mod+Ctrl+8 workspace $ws18
$bindsym $mod+Ctrl+9 workspace $ws19
$bindsym $mod+Ctrl+0 workspace $ws20

## Action // Move focused window to workspace 11-20 // $mod + Ctrl + Shift + [number] ##
$bindsym $mod+Ctrl+Shift+1 move container to workspace $ws11, exec $focus_ws_ok $ws11
$bindsym $mod+Ctrl+Shift+2 move container to workspace $ws12, exec $focus_ws_ok $ws12
$bindsym $mod+Ctrl+Shift+3 move container to workspace $ws13, exec $focus_ws_ok $ws13
$bindsym $mod+Ctrl+Shift+4 move container to workspace $ws14, exec $focus_ws_ok $ws14
$bindsym $mod+Ctrl+Shift+5 move container to workspace $ws15, exec $focus_ws_ok $ws15
$bindsym $mod+Ctrl+Shift+6 move container to workspace $ws16, exec $focus_ws_ok $ws16
$bindsym $mod+Ctrl+Shift+7 move container to workspace $ws17, exec $focus_ws_ok $ws17
$bindsym $mod+Ctrl+Shift+8 move container to workspace $ws18, exec $focus_ws_ok $ws18
$bindsym $mod+Ctrl+Shift+9 move container to workspace $ws19, exec $focus_ws_ok $ws19
$bindsym $mod+Ctrl+Shift+0 move container to workspace $ws20, exec $focus_ws_ok $ws20

## Navigation // Pick a workspace from a list ##
# Twenty workspaces is past what anyone tracks by number. swayr lists the ones
# that actually exist, with the autoname icons showing what is on each, so this
# is the practical way in for everything outside the handful you think of
# positionally. swayrd is already running for $mod+p and Alt+Tab.
#
# First use generates ~/.config/swayr/config.toml and pops a swaynag banner
# saying so; that is expected, and only happens once.
$bindsym $mod+g exec swayr switch-workspace
$bindsym $mod+Shift+g exec swayr move-focused-to-workspace

## Navigation // Previous/next workspace on this output ##
# _on_output rather than plain prev/next: with four displays, plain next walks
# into workspaces sitting on other monitors, which reads as the focus vanishing.
$bindsym $mod+Ctrl+Left workspace prev_on_output
$bindsym $mod+Ctrl+Right workspace next_on_output
